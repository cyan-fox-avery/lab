<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Berry Delightful — A Day at Starvale</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <span id="version">v0.3.0-nursery</span>
    <span id="hud-day">☀️ Day 1</span>
    <span id="hud-coins">🪙 20</span>
    <span id="hud-inv" title="inventory">🧺 0 · 🫙 0</span>
  </header>

  <div id="hint-bar"><span id="hint-emoji">📓</span> <span id="hint-text"></span></div>

  <nav id="category-nav">
    <button data-category="farm" class="active">🌾<span>Farm</span></button>
    <button data-category="shop">🛒<span>Shop</span></button>
  </nav>

  <nav id="scene-nav"></nav>

  <main id="scene"></main>

  <div id="overlay-root"></div>
  <div id="toast-root"></div>
</div>

<div id="global-bar">
  <button id="btn-journal">📓<span>Journal</span></button>
  <button id="btn-endday">🌙<span>End Day</span></button>
  <button id="btn-newgame">🔄<span>Start over</span></button>
</div>

<div id="save-note">Progress autosaves in this browser. All dialogue is placeholder.</div>

<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
